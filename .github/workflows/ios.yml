name: Compilar app iOS (sem assinatura, para o AltStore)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    # macos-26 traz o Xcode 26.x (o SideSign exige Swift 6 / swift-tools 6.0).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode (a versão estável mais nova do runner)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependências
        run: npm install --no-audit --no-fund

      - name: Projeto iOS (Swift Package Manager)
        run: |
          # O 'cap add' do CLI 7 erra o gerenciador no sync interno (tenta pod install); o projeto SPM
          # já fica criado, e o 'cap sync' abaixo detecta o CapApp-SPM e faz o resto.
          npx cap add ios --packagemanager SPM || true
          test -d ios/App/CapApp-SPM
          # O SideSign (renovação do perfil) exige iOS 15.
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          npx cap sync ios
          # Fixa as versões das dependências SPM (SideSign e as do mahee96 seguem branch main).
          mkdir -p ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp .github/Package.resolved ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cat ios/App/CapApp-SPM/Package.swift
          cat ios/App/App/capacitor.config.json
          grep -q AgendaRenovacaoPlugin ios/App/App/capacitor.config.json
          grep -q AgendaAcessoPlugin ios/App/App/capacitor.config.json

      - name: Permissões, segundo plano e domínios (Info.plist)
        run: |
          P=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$P" || true; }
          pb "Set :CFBundleShortVersionString 1.0.${{ github.run_number }}"
          pb "Set :CFBundleVersion ${{ github.run_number }}"
          pb "Delete :CFBundleDisplayName"
          pb "Add :CFBundleDisplayName string Agenda"
          pb "Add :NSLocationWhenInUseUsageDescription string A Agenda usa sua localização para registrar chegadas e saídas dos seus lugares."
          pb "Add :NSLocationAlwaysAndWhenInUseUsageDescription string A Agenda registra chegadas e saídas mesmo com o app fechado."
          pb "Add :NSLocationAlwaysUsageDescription string A Agenda registra chegadas e saídas mesmo com o app fechado."
          # Plugin AgendaAcesso: cada permissão só é pedida quando o usuário toca na função.
          pb "Add :NSMicrophoneUsageDescription string A Agenda usa o microfone só quando você toca no botão de falar, para ditar tarefas e perguntas ao Jarvis. O áudio não é gravado nem enviado."
          pb "Add :NSSpeechRecognitionUsageDescription string O que você fala é transcrito em português no próprio iPhone para virar tarefa ou pergunta ao Jarvis."
          pb "Add :NSContactsUsageDescription string A Agenda lê nome e telefone dos contatos que você buscar, para ligar uma tarefa a uma pessoa e abrir a ligação ou o WhatsApp. Os contatos não vão para a nuvem."
          pb "Add :NSCalendarsFullAccessUsageDescription string A Agenda mostra na tela inicial os eventos do seu calendário de hoje e da semana. Os eventos não vão para a nuvem."
          pb "Add :NSCalendarsUsageDescription string A Agenda mostra na tela inicial os eventos do seu calendário de hoje e da semana e cria eventos a partir das tarefas quando você pedir."
          pb "Add :NSCalendarsWriteOnlyAccessUsageDescription string A Agenda cria no seu calendário o evento de uma tarefa quando você pedir."
          pb "Add :NSPhotoLibraryAddUsageDescription string A Agenda salva no seu rolo só as imagens e PDFs que você mandar salvar."
          pb "Add :NSPhotoLibraryUsageDescription string Você escolhe as fotos pelo seletor do iPhone; a Agenda só recebe as que você escolher."
          pb "Add :UIBackgroundModes array"
          pb "Add :UIBackgroundModes:0 string location"
          pb "Add :WKAppBoundDomains array"
          pb "Add :WKAppBoundDomains:0 string lgrsv.github.io"
          pb "Add :WKAppBoundDomains:1 string uabpevnjfcwidbjscowq.supabase.co"
          # Esquema próprio: o LocalDevVPN (localdevvpn://enable?scheme=agenda-lgrsv) liga o túnel e volta para a Agenda.
          pb "Add :CFBundleURLTypes array"
          pb "Add :CFBundleURLTypes:0 dict"
          pb "Add :CFBundleURLTypes:0:CFBundleURLName string com.lgrsv.agenda"
          pb "Add :CFBundleURLTypes:0:CFBundleURLSchemes array"
          pb "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string agenda-lgrsv"
          /usr/libexec/PlistBuddy -c "Print" "$P"

      - name: Ícone
        run: |
          curl -fsSL https://lgrsv.github.io/agenda-iphone/icon-512.png -o /tmp/icon.png
          sips -z 1024 1024 /tmp/icon.png --out /tmp/icon1024.png
          sips -s format png -s formatOptions default /tmp/icon1024.png --out /tmp/icon1024.png
          ICON=$(ls ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png | head -1)
          cp /tmp/icon1024.png "$ICON"

      - name: Compilar (sem assinatura)
        run: |
          set -o pipefail
          cd ios/App
          if ! xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
                -destination 'generic/platform=iOS' -derivedDataPath build \
                -skipPackagePluginValidation -skipMacroValidation \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1; then
            grep -E "error:|fatal|cannot|unable to" build.log | sort -u | head -120
            tail -60 build.log
            exit 1
          fi
          tail -15 build.log
          cat App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || true

      - name: Log da compilação (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/App/build.log
          if-no-files-found: ignore

      - name: Ícones alternativos (trocados pelo próprio app, sem reinstalar)
        run: |
          APP=ios/App/build/Build/Products/Release-iphoneos/App.app
          P="$APP/Info.plist"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$P"; }
          pb "Print :CFBundleIcons" >/dev/null 2>&1 || pb "Add :CFBundleIcons dict"
          pb "Print :CFBundleIcons:CFBundleAlternateIcons" >/dev/null 2>&1 || pb "Add :CFBundleIcons:CFBundleAlternateIcons dict"
          for f in icones/*-1024.png; do
            NOME=$(basename "$f" -1024.png)
            sips -s format png -z 120 120 "$f" --out "$APP/Icone${NOME}@2x.png" >/dev/null
            sips -s format png -z 180 180 "$f" --out "$APP/Icone${NOME}@3x.png" >/dev/null
            pb "Add :CFBundleIcons:CFBundleAlternateIcons:${NOME} dict"
            pb "Add :CFBundleIcons:CFBundleAlternateIcons:${NOME}:CFBundleIconFiles array"
            pb "Add :CFBundleIcons:CFBundleAlternateIcons:${NOME}:CFBundleIconFiles:0 string Icone${NOME}"
            pb "Add :CFBundleIcons:CFBundleAlternateIcons:${NOME}:UIPrerenderedIcon bool false"
          done
          pb "Print :CFBundleIcons"
          ls -la "$APP" | grep -i icone

      - name: Gerar .ipa
        run: |
          mkdir -p out/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app out/Payload/
          cd out && zip -qry Agenda.ipa Payload && ls -la Agenda.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-ipa
          path: out/Agenda.ipa

      - name: Publicar na release "ultima"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ultima >/dev/null 2>&1 || gh release create ultima --title "Agenda (iOS)" --notes "Instalar pelo AltStore; depois o próprio app se atualiza (menu Renovação do app)."
          gh release upload ultima out/Agenda.ipa --clobber

      - name: Atualizar a fonte do AltStore (altstore.json)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAM=$(stat -f%z out/Agenda.ipa)
          VER="1.0.${{ github.run_number }}"
          DATA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git fetch origin fonte 2>/dev/null && git checkout fonte 2>/dev/null || git checkout --orphan fonte
          git rm -rq . 2>/dev/null || true
          cat > altstore.json <<JSON
          {
            "name": "Agenda do Lagares",
            "identifier": "com.lgrsv.agenda.fonte",
            "sourceURL": "https://raw.githubusercontent.com/LGRSV/agenda-app/fonte/altstore.json",
            "apps": [{
              "name": "Agenda",
              "bundleIdentifier": "com.lgrsv.agenda",
              "developerName": "LGRSV",
              "localizedDescription": "Agenda com GPS em segundo plano, lembretes locais, renovação automática do perfil de 7 dias e atualização pelo próprio app (LocalDevVPN + pairing file).",
              "iconURL": "https://lgrsv.github.io/agenda-iphone/icon-512.png",
              "versions": [{
                "version": "$VER",
                "buildVersion": "${{ github.run_number }}",
                "date": "$DATA",
                "downloadURL": "https://github.com/LGRSV/agenda-app/releases/download/ultima/Agenda.ipa",
                "size": $TAM,
                "minOSVersion": "15.0"
              }],
              "appPermissions": { "entitlements": [], "privacy": {
                "NSLocationWhenInUseUsageDescription": "Registrar chegadas e saídas dos seus lugares.",
                "NSLocationAlwaysAndWhenInUseUsageDescription": "Registrar chegadas e saídas com o app fechado.",
                "NSLocationAlwaysUsageDescription": "Registrar chegadas e saídas com o app fechado.",
                "NSMicrophoneUsageDescription": "Ditar tarefas e perguntas ao Jarvis (só ao tocar no microfone).",
                "NSSpeechRecognitionUsageDescription": "Transcrever o ditado em português no próprio iPhone.",
                "NSContactsUsageDescription": "Buscar nome e telefone para ligar uma tarefa a uma pessoa.",
                "NSCalendarsFullAccessUsageDescription": "Mostrar os eventos do dia e da semana na tela inicial.",
                "NSPhotoLibraryAddUsageDescription": "Salvar no rolo as imagens e PDFs que você pedir." } }
            }],
            "news": []
          }
          JSON
          python3 -m json.tool altstore.json > /dev/null
          git -c user.name="github-actions" -c user.email="actions@github.com" add altstore.json
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Fonte AltStore: Agenda $VER"
          git push -q origin fonte
